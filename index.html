<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .auth-box { background: white; padding: 40px; border-radius: 8px; max-width: 400px; margin: 50px auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: system-ui; }
    button { padding: 10px 16px; border: none; border-radius: 4px; background: #667eea; color: white; cursor: pointer; font-weight: 500; }
    button:hover { background: #5568d3; }
    .danger { background: #dc3545; }
    .danger:hover { background: #c82333; }
    .hidden { display: none !important; }
    header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; }
    .stat-card .number { font-size: 28px; font-weight: bold; color: #667eea; }
    .controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 100px; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .project-card { background: white; padding: 20px; border-radius: 8px; }
    .project-card h3 { margin-bottom: 10px; }
    .project-card .actions { display: flex; gap: 8px; margin-top: 15px; }
    .project-card .actions button { flex: 1; padding: 8px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; margin-top: 20px; }
    table th { background: #f5f5f5; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; }
    table td { padding: 12px; border-bottom: 1px solid #eee; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="authScreen">
    <div class="auth-box">
      <h2>Project Tracker</h2>
      <div class="form-group">
        <label>Project URL</label>
        <input type="text" id="projectUrl" placeholder="https://your-project.supabase.co">
      </div>
      <div class="form-group">
        <label>Anon Key</label>
        <input type="password" id="anonKey" placeholder="Your anon key">
      </div>
      <button onclick="connectSupabase()" style="width: 100%;">Connect</button>
      <p
