<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
    .auth { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #5568d3; }
    .app { display: none; max-width: 1200px; margin: 0 auto; }
    .app.show { display: block; }
    header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; }
    h1 { color: #667eea; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; margin-top: 20px; }
    th { background: #f5f5f5; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="auth" class="auth">
    <h2>Project Tracker</h2>
    <div class="form-group">
      <label>Project URL</label>
      <input type="text" id="url" placeholder="https://xxx.supabase.co">
    </div>
    <div class="form-group">
      <label>Anon Key</label>
      <input type="password" id="key" placeholder="sb_publishable_...">
    </div>
    <button onclick="connect()">Connect</button>
    <br>
    <div class="form-group" style="margin-top: 20px;">
      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>
    <button onclick="login()">Send Magic Link</button>
  </div>

  <div id="app" class="app">
    <header>
      <h1>📊 Project Tracker</h1>
      <button onclick="logout()">Logout</button>
    </header>
    <button onclick="alert('Add project feature coming soon!')">+ New Project</button>
    <table>
      <thead><tr><th>Date</th><th>Hours</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <script>
    let db = null;

    function connect() {
      const url = document.getElementById('url').value;
      const key = document.getElementById('key').value;
      if (url && key) {
        db = supabase.createClient(url, key);
        localStorage.setItem('sb', JSON.stringify({url, key}));
        alert('Connected!');
      }
    }

    async function login() {
      if (!db) return alert('Connect first');
      const email = document.getElementById('email').value;
      await db.auth.signInWithOtp({email});
      alert('Check your email!');
    }

    async function init() {
      const saved = localStorage.getItem('sb');
      if (saved) {
        const {url, key} = JSON.parse(saved);
        db = supabase.createClient(url, key);
        const {data} = await db.auth.getSession();
        if (data.session) {
          document.getElementById('auth').style.display = 'none';
          document.getElementById('app').classList.add('show');
        }
      }
    }

    function logout() {
      db.auth.signOut();
      location.reload();
    }

    init();
  </script>
</body>
</html>
