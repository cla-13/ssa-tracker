<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }

    /* Auth Screen */
    .auth-screen { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; }
    .auth-screen h2 { margin-bottom: 30px; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #5568d3; }
    button.test { background: #28a745; margin-top: 20px; }
    button.test:hover { background: #218838; }

    /* App Screen */
    .app-screen { display: none; }
    .app-screen.active { display: block; }

    header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { color: #667eea; font-size: 24px; }
    header .controls { display: flex; gap: 10px; }
    header button { width: auto; padding: 8px 16px; margin: 0; }
    .live-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
    .live-dot.active { background: #28a745; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background: white; border: 2px solid #ddd; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .tab-btn:hover { background: #f0f0f0; }
    .tab-btn.active:hover { background: #667eea; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Projects Tab */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .project-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .project-card h3 { margin-bottom: 10px; color: #667eea; }
    .project-card .meta { font-size: 12px; color: #666; margin: 8px 0; }
    .project-card .actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .project-card .actions button { padding: 8px 12px; font-size: 12px; flex: 1; min-width: 60px; }

    /* Overview Tab */
    .overview-table { background: white; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f5f5f5; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; font-weight: 600; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f9f9f9; }
    .actions { display: flex; gap: 8px; }
    .actions button { padding: 6px 12px; font-size: 12px; min-width: 60px; }
    .danger { background: #dc3545; }
    .danger:hover { background: #c82333; }
    .secondary { background: #6c757d; }
    .secondary:hover { background: #5a6268; }

    .empty { text-align: center; padding: 40px 20px; color: #999; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.show { display: flex; }
    .modal-content { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    .time-log { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
    .time-log h4 { margin-bottom: 10px; color: #333; }
    .time-entry { background: #f9f9f9; padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen" class="auth-screen">
    <h2>Project Tracker</h2>
    <div class="form-group">
      <label>Project URL</label>
      <input type="text" id="projectUrl" placeholder="https://xxx.supabase.co">
    </div>
    <div class="form-group">
      <label>Anon Key</label>
      <input type="password" id="anonKey" placeholder="sb_publishable_...">
    </div>
    <button onclick="connectSupabase()">Connect Supabase</button>
    <p id="connMsg" style="margin-top: 10px; font-size: 12px;"></p>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="your.email@company.com">
    </div>
    <button onclick="login()">Login</button>
    <button class="test" onclick="enterTestMode()">🧪 Test Mode</button>
  </div>

  <!-- App Screen -->
  <div id="appScreen" class="app-screen">
    <div class="container">
      <header>
        <h1>📊 Project Tracker</h1>
        <div class="controls">
          <div class="live-status">
            <div class="live-dot" id="liveDot"></div>
            <span id="liveText">Connecting...</span>
          </div>
          <button onclick="logout()">Logout</button>
        </div>
      </header>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('projects')">📋 Projects</button>
        <button class="tab-btn" onclick="switchTab('overview')">📊 Overview</button>
      </div>

      <!-- Projects Tab -->
      <div id="projects" class="tab-content active">
        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
          <button onclick="openCreateProjectModal()">+ New Project</button>
          <button onclick="exportAllCSV()" style="background: #6c757d;">📥 Export All</button>
        </div>
        <div class="projects-grid" id="projectsList"></div>
      </div>

      <!-- Overview Tab -->
      <div id="overview" class="tab-content">
        <div style="margin-bottom: 20px;">
          <button onclick="exportAllCSV()" style="background: #6c757d;">📥 Export All</button>
        </div>
        <div class="overview-table" id="overviewList"></div>
      </div>
    </div>
  </div>

  <!-- New Project Modal -->
  <div id="newProjectModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Create New Project</div>
      <div class="form-group">
        <label>Project Name *</label>
        <input type="text" id="newProjName" required>
      </div>
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="newProjCreatorName" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Date *</label>
        <input type="date" id="newProjDate" required>
      </div>
      <div class="form-group">
        <label>Due Date (optional)</label>
        <input type="date" id="newProjDueDate">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="newProjStatus" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Collaborators (comma separated, optional)</label>
        <input type="text" id="newProjCollaborators" placeholder="email1@company.com, email2@company.com">
      </div>
      <div class="modal-footer">
        <button class="secondary" onclick="closeModal('newProjectModal')">Cancel</button>
        <button onclick="addProject()">Create</button>
      </div>
    </div>
  </div>

  <!-- Edit Project Modal -->
  <div id="editProjectModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Edit Project</div>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="editProjName">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="editProjStatus" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Creator</label>
        <input type="text" id="editProjCreator" readonly style="background: #f5f5f5;">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="editProjDate">
      </div>
      <div class="form-group">
        <label>Due Date (optional)</label>
        <input type="date" id="editProjDueDate">
      </div>
      <div class="form-group">
        <label>Collaborators (comma separated, optional)</label>
        <input type="text" id="editProjCollaborators" placeholder="email1@company.com, email2@company.com">
      </div>
      <div class="modal-footer">
        <button class="secondary" onclick="closeModal('editProjectModal')">Cancel</button>
        <button class="danger" id="deleteBtn" onclick="deleteProject()" style="margin-right: auto;">Delete</button>
        <button onclick="saveProject()">Save</button>
      </div>
    </div>
  </div>

  <!-- Time Entry Modal -->
  <div id="timeEntryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Log Time</div>
      <div class="form-group">
        <label>Date *</label>
        <input type="date" id="logDate" required>
      </div>
      <div class="form-group">
        <label>Hours *</label>
        <input type="number" id="logHours" step="0.25" required>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="logNotes" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; min-height: 60px;"></textarea>
      </div>
      <div id="timeLogDisplay" class="time-log" style="display: none;">
        <h4>Previous entries:</h4>
        <div id="timeLogList"></div>
      </div>
      <div class="modal-footer">
        <button class="secondary" onclick="closeModal('timeEntryModal')">Cancel</button>
        <button onclick="logTime()">Save Entry</button>
      </div>
    </div>
  </div>

  <script>
    let db = null;
    let user = null;
    let currentProjectId = null;
    let projects = [];
    let timeEntries = [];
    let subscription = null;
    let testMode = false;

    const allowedDelete = ['c.delossantos@elsevier.com', 'y.mejala@elsevier.com', 'k.lamkins@elsevier.com', 'test@test.com'];

    function connectSupabase() {
      const url = document.getElementById('projectUrl').value.trim();
      const key = document.getElementById('anonKey').value.trim();
      if (!url || !key) {
        document.getElementById('connMsg').textContent = 'Enter URL and key';
        document.getElementById('connMsg').style.color = '#dc3545';
        return;
      }
      db = window.supabase.createClient(url, key);
      localStorage.setItem('sbConfig', JSON.stringify({ url, key }));
      document.getElementById('connMsg').textContent = 'Connected! Now login.';
      document.getElementById('connMsg').style.color = '#28a745';
    }

    function login() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        alert('Enter your email');
        return;
      }
      if (!db) {
        alert('Connect to Supabase first');
        return;
      }
      user = email;
      localStorage.setItem('user', user);
      loadData();
      showApp();
    }

    function enterTestMode() {
      testMode = true;
      user = 'test@test.com';
      localStorage.setItem('testMode', 'true');
      loadData();
      showApp();
    }

    function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('appScreen').classList.add('active');
      setupRealtime();
    }

    function logout() {
      user = null;
      testMode = false;
      localStorage.removeItem('user');
      localStorage.removeItem('testMode');
      if (subscription) subscription.unsubscribe();
      location.reload();
    }

    async function loadData() {
      if (testMode) {
        projects = JSON.parse(localStorage.getItem('projects') || '[]');
        timeEntries = JSON.parse(localStorage.getItem('timeEntries') || '[]');
      } else if (db) {
        try {
          const { data: p } = await db.from('ssa_projects').select('*');
          const { data: t } = await db.from('ssa_time_entries').select('*');
          projects = p || [];
          timeEntries = t || [];
        } catch (err) {
          console.error('Error loading data:', err);
        }
      }
      render();
    }

    function saveData() {
      if (testMode) {
        localStorage.setItem('projects', JSON.stringify(projects));
        localStorage.setItem('timeEntries', JSON.stringify(timeEntries));
      }
      render();
    }

    function setupRealtime() {
      if (testMode) {
        document.getElementById('liveDot').classList.add('active');
        document.getElementById('liveText').textContent = 'Test Mode';
        window.addEventListener('storage', () => loadData());
        return;
      }
      if (!db) return;
      if (subscription) subscription.unsubscribe();
      subscription = db.channel('changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ssa_projects' }, () => loadData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ssa_time_entries' }, () => loadData())
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            document.getElementById('liveDot').classList.add('active');
            document.getElementById('liveText').textContent = 'Live updates on';
          }
        });
    }

    function render() {
      renderProjects();
      renderOverview();
    }

    function renderProjects() {
      const list = document.getElementById('projectsList');
      if (!projects.length) {
        list.innerHTML = '<div class="empty" style="grid-column: 1/-1;">No projects yet</div>';
        return;
      }
      list.innerHTML = projects.map(p => {
        const entries = timeEntries.filter(t => t.project_id === p.id);
        const totalHours = entries.reduce((s, t) => s + t.hours, 0);
        return `
          <div class="project-card">
            <h3>${p.name}</h3>
            <div class="meta">Status: ${p.status}</div>
            <div class="meta">Creator: ${p.creator_name || p.created_by}</div>
            <div class="meta">Date: ${p.project_date || 'N/A'}</div>
            ${p.due_date ? `<div class="meta">Due: ${p.due_date}</div>` : ''}
            <div class="meta">Total Hours: ${totalHours.toFixed(1)}h</div>
            ${p.collaborators ? `<div class="meta">Team: ${p.collaborators}</div>` : ''}
            <div class="actions">
              <button onclick="openTimeEntry('${p.id}')">⏱️ Log Time</button>
              <button class="secondary" onclick="openEditProject('${p.id}')">✏️ Edit</button>
              <button class="secondary" onclick="exportProjectCSV('${p.id}')">📥 Export</button>
              ${allowedDelete.includes(user) ? `<button class="danger" onclick="deleteProjectDirect('${p.id}')">🗑️ Delete</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderOverview() {
      const list = document.getElementById('overviewList');
      if (!projects.length) {
        list.innerHTML = '<div class="empty">No projects yet</div>';
        return;
      }
      let html = '<table><thead><tr><th>Project</th><th>Status</th><th>Creator</th><th>Date</th><th>Due Date</th><th>Hours</th><th>Actions</th></tr></thead><tbody>';
      let totalHoursAll = 0;
      projects.forEach(p => {
        const hours = timeEntries.filter(t => t.project_id === p.id).reduce((s, t) => s + t.hours, 0);
        totalHoursAll += hours;
        html += `<tr>
          <td>${p.name}</td>
          <td>${p.status}</td>
          <td>${p.creator_name || p.created_by}</td>
          <td>${p.project_date || 'N/A'}</td>
          <td>${p.due_date || '-'}</td>
          <td>${hours.toFixed(1)}h</td>
          <td class="actions">
            <button onclick="openTimeEntry('${p.id}')">Log</button>
            <button class="secondary" onclick="openEditProject('${p.id}')">Edit</button>
            <button class="secondary" onclick="exportProjectCSV('${p.id}')">Export</button>
            ${allowedDelete.includes(user) ? `<button class="danger" onclick="deleteProjectDirect('${p.id}')">Delete</button>` : ''}
          </td>
        </tr>`;
      });
      html += `<tr style="background: #667eea; color: white; font-weight: bold;">
        <td colspan="5">TOTAL HOURS</td>
        <td>${totalHoursAll.toFixed(1)}h</td>
        <td></td>
      </tr>`;
      html += '</tbody></table>';
      list.innerHTML = html;
    }

    function openCreateProjectModal() {
      document.getElementById('newProjName').value = '';
      document.getElementById('newProjCreatorName').value = '';
      document.getElementById('newProjDate').valueAsDate = new Date();
      document.getElementById('newProjDueDate').value = '';
      document.getElementById('newProjStatus').value = 'Planned';
      document.getElementById('newProjCollaborators').value = '';
      openModal('newProjectModal');
    }

    async function addProject() {
      const name = document.getElementById('newProjName').value.trim();
      const creator_name = document.getElementById('newProjCreatorName').value.trim();
      const project_date = document.getElementById('newProjDate').value;
      const due_date = document.getElementById('newProjDueDate').value || null;
      const status = document.getElementById('newProjStatus').value;
      const collaborators = document.getElementById('newProjCollaborators').value.trim() || null;
      if (!name || !creator_name || !project_date) {
        alert('Fill in required fields');
        return;
      }
      const newProj = { id: Date.now(), name, status, created_by: user, creator_name, project_date, due_date, collaborators };
      projects.push(newProj);
      if (testMode) {
        saveData();
        closeModal('newProjectModal');
      } else if (db) {
        try {
          const { error } = await db.from('ssa_projects').insert([newProj]);
          if (error) {
            alert('Error saving: ' + error.message);
            projects.pop();
            return;
          }
          closeModal('newProjectModal');
        } catch (err) {
          alert('Error: ' + err.message);
          projects.pop();
        }
      }
    }

    function openEditProject(id) {
      const proj = projects.find(p => p.id == id);
      if (!proj) return;
      currentProjectId = id;
      document.getElementById('editProjName').value = proj.name;
      document.getElementById('editProjStatus').value = proj.status;
      document.getElementById('editProjCreator').value = proj.created_by;
      document.getElementById('editProjDate').value = proj.project_date || '';
      document.getElementById('editProjDueDate').value = proj.due_date || '';
      document.getElementById('editProjCollaborators').value = proj.collaborators || '';
      document.getElementById('deleteBtn').style.display = allowedDelete.includes(user) ? 'block' : 'none';
      openModal('editProjectModal');
    }

    async function saveProject() {
      const proj = projects.find(p => p.id == currentProjectId);
      if (!proj) return;
      proj.name = document.getElementById('editProjName').value;
      proj.status = document.getElementById('editProjStatus').value;
      proj.project_date = document.getElementById('editProjDate').value || null;
      proj.due_date = document.getElementById('editProjDueDate').value || null;
      proj.collaborators = document.getElementById('editProjCollaborators').value;
      if (testMode) {
        saveData();
      } else if (db) {
        try {
          await db.from('ssa_projects').update(proj).eq('id', proj.id);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
      closeModal('editProjectModal');
    }

    function deleteProject() {
      if (!allowedDelete.includes(user)) {
        alert('No permission');
        return;
      }
      if (!confirm('Delete project and all time entries?')) return;
      deleteProjectDirect(currentProjectId);
      closeModal('editProjectModal');
    }

    async function deleteProjectDirect(id) {
      if (!allowedDelete.includes(user)) {
        alert('No permission');
        return;
      }
      if (!confirm('Delete?')) return;
      projects = projects.filter(p => p.id != id);
      timeEntries = timeEntries.filter(t => t.project_id != id);
      if (testMode) {
        saveData();
      } else if (db) {
        try {
          await db.from('ssa_time_entries').delete().eq('project_id', id);
          await db.from('ssa_projects').delete().eq('id', id);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
    }

    function openTimeEntry(id) {
      currentProjectId = id;
      document.getElementById('logDate').valueAsDate = new Date();
      document.getElementById('logHours').value = '';
      document.getElementById('logNotes').value = '';
      const entries = timeEntries.filter(t => t.project_id == id);
      if (entries.length) {
        document.getElementById('timeLogDisplay').style.display = 'block';
        document.getElementById('timeLogList').innerHTML = entries.map(e =>
          `<div class="time-entry">${e.date_worked}: ${e.hours}h ${e.notes ? '- ' + e.notes : ''}</div>`
        ).join('');
      } else {
        document.getElementById('timeLogDisplay').style.display = 'none';
      }
      openModal('timeEntryModal');
    }

    async function logTime() {
      const date = document.getElementById('logDate').value;
      const hours = parseFloat(document.getElementById('logHours').value);
      const notes = document.getElementById('logNotes').value;
      if (!date || !hours) {
        alert('Fill required fields');
        return;
      }
      const existing = timeEntries.find(t => t.project_id == currentProjectId && t.date_worked === date);
      if (existing) {
        existing.hours += hours;
        existing.notes = (existing.notes ? existing.notes + '; ' : '') + notes;
      } else {
        timeEntries.push({ id: Date.now(), project_id: currentProjectId, date_worked: date, hours, notes, logged_by: user });
      }
      if (testMode) {
        saveData();
      } else if (db) {
        try {
          if (existing) {
            await db.from('ssa_time_entries').update(existing).eq('id', existing.id);
          } else {
            await db.from('ssa_time_entries').insert([timeEntries[timeEntries.length - 1]]);
          }
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
      closeModal('timeEntryModal');
    }

    function exportAllCSV() {
      let csv = 'Project,Status,Creator,Date,Due Date,Total Hours\n';
      let totalHoursAll = 0;
      projects.forEach(p => {
        const hours = timeEntries.filter(t => t.project_id == p.id).reduce((s, t) => s + t.hours, 0);
        totalHoursAll += hours;
        csv += `"${p.name}","${p.status}","${p.creator_name || p.created_by}","${p.project_date || ''}","${p.due_date || ''}","${hours.toFixed(1)}"\n`;
      });
      csv += `\nTOTAL HOURS,,,,,${totalHoursAll.toFixed(1)}\n`;
      const blob = new Blob([csv], { type: 'text/csv' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'projects.csv';
      link.click();
    }

    function exportProjectCSV(projectId) {
      const proj = projects.find(p => p.id == projectId);
      if (!proj) return;
      const entries = timeEntries.filter(t => t.project_id == projectId);
      let csv = `Project: ${proj.name}\nStatus: ${proj.status}\nCreator: ${proj.created_by}\nCollaborators: ${proj.collaborators || 'None'}\n\nDate,Hours,Notes\n`;
      entries.forEach(e => {
        csv += `"${e.date_worked}","${e.hours}","${e.notes || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${proj.name}.csv`;
      link.click();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    function openModal(id) {
      document.getElementById(id).classList.add('show');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function init() {
      const saved = localStorage.getItem('sbConfig');
      if (saved) {
        const { url, key } = JSON.parse(saved);
        db = window.supabase.createClient(url, key);
      }
      const savedUser = localStorage.getItem('user');
      const savedTestMode = localStorage.getItem('testMode');
      if (savedTestMode) {
        testMode = true;
        user = 'test@test.com';
        loadData();
        showApp();
      } else if (savedUser) {
        user = savedUser;
        loadData();
        showApp();
      }
    }

    init();
  </script>
</body>
</html>
