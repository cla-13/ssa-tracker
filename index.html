<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    .auth-screen { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; }
    .auth-screen h2 { margin-bottom: 30px; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background: #5568d3; }
    button.test { background: #28a745; margin-top: 20px; }
    button.test:hover { background: #218838; }
    .error { color: #dc3545; font-size: 12px; margin-top: 5px; }
    .app-screen { display: none; }
    .app-screen.active { display: block; }
    header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { color: #667eea; font-size: 24px; }
    header .controls { display: flex; gap: 10px; align-items: center; }
    header button { width: auto; padding: 8px 16px; margin: 0; }
    .live-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
    .live-dot.active { background: #28a745; }
    .user-info { font-size: 13px; color: #666; }
    .admin-badge { background: #ffc107; color: #333; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background: white; border: 2px solid #ddd; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .tab-btn:hover { background: #f0f0f0; }
    .tab-btn.active:hover { background: #667eea; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .project-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .project-card h3 { margin-bottom: 10px; color: #667eea; }
    .project-card .meta { font-size: 12px; color: #666; margin: 8px 0; }
    .project-card .actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .project-card .actions button { padding: 8px 12px; font-size: 12px; flex: 1; min-width: 60px; }
    .overview-table { background: white; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f5f5f5; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; font-weight: 600; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f9f9f9; }
    .actions { display: flex; gap: 8px; }
    .actions button { padding: 6px 12px; font-size: 12px; min-width: 60px; }
    .danger { background: #dc3545; }
    .danger:hover { background: #c82333; }
    .secondary { background: #6c757d; }
    .secondary:hover { background: #5a6268; }
    .empty { text-align: center; padding: 40px 20px; color: #999; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.show { display: flex; }
    .modal-content { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .time-log { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
    .time-log h4 { margin-bottom: 10px; color: #333; }
    .time-entry { background: #f9f9f9; padding: 10px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .time-entry-info { flex: 1; }
    .time-entry-actions { display: flex; gap: 5px; }
    .time-entry-actions button { padding: 4px 8px; font-size: 11px; }
  </style>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <h2>Project Tracker</h2>
    <div class="form-group"><label>Project URL</label><input type="text" id="projectUrl" placeholder="https://xxx.supabase.co"></div>
    <div class="form-group"><label>Anon Key</label><input type="password" id="anonKey" placeholder="sb_publishable_..."></div>
    <button onclick="connectSupabase()">Connect Supabase</button>
    <p id="connMsg" style="margin-top: 10px; font-size: 12px;"></p>
    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
    <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="your.email@elsevier.com"><div id="emailError" class="error" style="display: none;"></div></div>
    <button onclick="login()">Login</button>
    <button class="test" onclick="enterTestMode()">🧪 Test Mode</button>
  </div>

  <div id="appScreen" class="app-screen">
    <div class="container">
      <header>
        <h1>📊 Project Tracker</h1>
        <div class="controls">
          <div class="user-info"><span id="userDisplay"></span><span id="adminBadge" class="admin-badge" style="display: none; margin-left: 8px;">ADMIN</span></div>
          <div class="live-status"><div class="live-dot" id="liveDot"></div><span id="liveText">Connecting...</span></div>
          <button onclick="logout()">Logout</button>
        </div>
      </header>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('projects')">📋 Projects</button>
        <button class="tab-btn" onclick="switchTab('overview')">📊 Overview</button>
      </div>
      <div id="projects" class="tab-content active">
        <div style="margin-bottom: 20px; display: flex; gap: 10px;"><button onclick="openCreateProjectModal()">+ New Project</button><button onclick="exportAllCSV()" style="background: #6c757d;">📥 Export All</button></div>
        <div class="projects-grid" id="projectsList"></div>
      </div>
      <div id="overview" class="tab-content">
        <div style="margin-bottom: 20px;"><button onclick="exportAllCSV()" style="background: #6c757d;">📥 Export All</button></div>
        <div class="overview-table" id="overviewList"></div>
      </div>
    </div>
  </div>

  <div id="newProjectModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Create New Project</div>
      <div class="form-group"><label>Project Name *</label><input type="text" id="newProjName" required></div>
      <div class="form-group"><label>Name *</label><input type="text" id="newProjCreatorName" required placeholder="Your name"></div>
      <div class="form-group"><label>Date *</label><input type="date" id="newProjDate" required></div>
      <div class="form-group"><label>Due Date (optional)</label><input type="date" id="newProjDueDate"></div>
      <div class="form-group"><label>Status</label><select id="newProjStatus" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"><option value="Planned">Planned</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></div>
      <div class="form-group"><label>Collaborators (comma separated, optional)</label><input type="text" id="newProjCollaborators" placeholder="email1@elsevier.com, email2@elsevier.com"></div>
      <div class="modal-footer"><button class="secondary" onclick="closeModal('newProjectModal')">Cancel</button><button onclick="addProject()">Create</button></div>
    </div>
  </div>

  <div id="editProjectModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Edit Project</div>
      <div class="form-group"><label>Project Name</label><input type="text" id="editProjName"></div>
      <div class="form-group"><label>Status</label><select id="editProjStatus" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"><option value="Planned">Planned</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></div>
      <div class="form-group"><label>Creator</label><input type="text" id="editProjCreator" readonly style="background: #f5f5f5;"></div>
      <div class="form-group"><label>Date</label><input type="date" id="editProjDate"></div>
      <div class="form-group"><label>Due Date (optional)</label><input type="date" id="editProjDueDate"></div>
      <div class="form-group"><label>Collaborators (comma separated, optional)</label><input type="text" id="editProjCollaborators" placeholder="email1@elsevier.com, email2@elsevier.com"></div>
      <div class="modal-footer"><button class="secondary" onclick="closeModal('editProjectModal')">Cancel</button><button class="danger" id="deleteBtn" onclick="deleteProject()" style="margin-right: auto;">Delete</button><button onclick="saveProject()">Save</button></div>
    </div>
  </div>

  <div id="timeEntryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header" id="timeEntryModalHeader">Log Time</div>
      <div class="form-group"><label>Your Full Name *</label><input type="text" id="loggerName" required placeholder="Your name for this entry"></div>
      <div class="form-group"><label>Date *</label><input type="date" id="logDate" required></div>
      <div class="form-group"><label>Hours *</label><input type="number" id="logHours" step="0.25" required></div>
      <div class="form-group"><label>Notes</label><textarea id="logNotes" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; min-height: 60px;"></textarea></div>
      <div id="timeLogDisplay" class="time-log" style="display: none;"><h4>Previous entries:</h4><div id="timeLogList"></div></div>
      <div class="modal-footer"><button class="secondary" onclick="closeModal('timeEntryModal')">Cancel</button><button id="timeEntryDeleteBtn" class="danger" onclick="deleteCurrentTimeEntry()" style="display: none; margin-right: auto;">Delete</button><button onclick="logTime()">Save Entry</button></div>
    </div>
  </div>

  <script>
    let db = null, user = null, isAdmin = false, currentProjectId = null, currentEditingTimeEntryId = null, projects = [], timeEntries = [], subscription = null, testMode = false;
    const adminEmails = ['c.delossantos@elsevier.com', 'kelly.lamkins@elsevier.com', 'y.mejala@elsevier.com'];

    function connectSupabase() { const url = document.getElementById('projectUrl').value.trim(), key = document.getElementById('anonKey').value.trim(); if (!url || !key) { document.getElementById('connMsg').textContent = 'Enter URL and key'; document.getElementById('connMsg').style.color = '#dc3545'; return; } db = window.supabase.createClient(url, key); localStorage.setItem('sbConfig', JSON.stringify({ url, key })); document.getElementById('connMsg').textContent = 'Connected! Now login.'; document.getElementById('connMsg').style.color = '#28a745'; }

    function saveData() { if (testMode) localStorage.setItem('projects', JSON.stringify(projects)), localStorage.setItem('timeEntries', JSON.stringify(timeEntries)); render(); }

    function renderProjects() { const e = document.getElementById('projectsList'); e.innerHTML = projects.length ? projects.map(t => { const r = timeEntries.filter(e => e.project_id === t.id), n = r.reduce((e, t) => e + t.hours, 0); return `<div class="project-card"><h3>${t.name}</h3><div class="meta">Status: ${t.status}</div><div class="meta">Creator: ${t.creator_name || t.created_by}</div><div class="meta">Date: ${t.project_date || 'N/A'}</div>${t.due_date ? `<div class="meta">Due: ${t.due_date}</div>` : ''}<div class="meta">Total Hours: ${n.toFixed(1)}h</div>${t.collaborators ? `<div class="meta">Team: ${t.collaborators}</div>` : ''}<div class="actions"><button onclick="openTimeEntry('${t.id}')">⏱️ Log Time</button><button class="secondary" onclick="openEditProject('${t.id}')">✏️ Edit</button><button class="secondary" onclick="exportProjectXLS('${t.id}')">📥 Export</button>${isAdmin ? `<button class="danger" onclick="deleteProjectDirect('${t.id}')">🗑️ Delete</button>` : ''}</div></div>`; }).join('') : '<div class="empty" style="grid-column: 1/-1;">No projects yet</div>'; }
    function renderOverview() { const e = document.getElementById('overviewList'); e.innerHTML = projects.length ? (() => { let t = '<table><thead><tr><th>Project</th><th>Status</th><th>Creator</th><th>Date</th><th>Due Date</th><th>Hours</th><th>Actions</th></tr></thead><tbody>'; let r = 0; projects.forEach(n => { const o = timeEntries.filter(e => e.project_id === n.id).reduce((e, t) => e + t.hours, 0); r += o; t += `<tr><td>${n.name}</td><td>${n.status}</td><td>${n.creator_name || n.created_by}</td><td>${n.project_date || 'N/A'}</td><td>${n.due_date || '-'}</td><td>${o.toFixed(1)}h</td><td class="actions"><button onclick="openTimeEntry('${n.id}')">Log</button><button class="secondary" onclick="openEditProject('${n.id}')">Edit</button><button class="secondary" onclick="exportProjectXLS('${n.id}')">Export</button>${isAdmin ? `<button class="danger" onclick="deleteProjectDirect('${n.id}')">Delete</button>` : ''}</td></tr>`; }); return t + `<tr style="background: #667eea; color: white; font-weight: bold;"><td colspan="5">TOTAL HOURS</td><td>${r.toFixed(1)}h</td><td></td></tr></tbody></table>`; })() : '<div class="empty">No projects yet</div>'; }
    function openCreateProjectModal() { document.getElementById('newProjName').value = ''; document.getElementById('newProjCreatorName').value = ''; document.getElementById('newProjDate').valueAsDate = new Date(); document.getElementById('newProjDueDate').value = ''; document.getElementById('newProjStatus').value = 'Planned'; document.getElementById('newProjCollaborators').value = ''; openModal('newProjectModal'); }
    async function addProject() { const e = document.getElementById('newProjName').value.trim(), t = document.getElementById('newProjCreatorName').value.trim(), r = document.getElementById('newProjDate').value, n = document.getElementById('newProjDueDate').value || null, o = document.getElementById('newProjStatus').value, a = document.getElementById('newProjCollaborators').value.trim() || null; if (e && t && r) { const c = { id: Date.now(), name: e, status: o, created_by: user, creator_name: t, project_date: r, due_date: n, collaborators: a }; projects.push(c); if (testMode) saveData(), closeModal('newProjectModal'); else if (db) try { const { error: d } = await db.from('ssa_projects').insert([c]); d ? (alert('Error saving: ' + d.message), projects.pop()) : closeModal('newProjectModal'); } catch (e) { alert('Error: ' + e.message), projects.pop(); } } else alert('Fill in required fields'); }

    async function saveProject() { const e = projects.find(e => e.id == currentProjectId); e && (e.name = document.getElementById('editProjName').value, e.status = document.getElementById('editProjStatus').value, e.project_date = document.getElementById('editProjDate').value || null, e.due_date = document.getElementById('editProjDueDate').value || null, e.collaborators = document.getElementById('editProjCollaborators').value, testMode ? saveData() : db && await db.from('ssa_projects').update(e).eq('id', e.id).catch(e => alert('Error: ' + e.message)), closeModal('editProjectModal')); }
    function deleteProject() { isAdmin ? confirm('Delete project and all time entries?') && (deleteProjectDirect(currentProjectId), closeModal('editProjectModal')) : alert('No permission'); }
    async function deleteProjectDirect(e) { isAdmin ? confirm('Delete?') && (projects = projects.filter(t => t.id != e), timeEntries = timeEntries.filter(t => t.project_id != e), testMode ? saveData() : db && (await db.from('ssa_time_entries').delete().eq('project_id', e), await db.from('ssa_projects').delete().eq('id', e)).catch(e => alert('Error: ' + e.message))) : alert('No permission'); }
    function canAccessProject(e) { const t = projects.find(t => t.id == e); return t ? isAdmin || t.created_by === user || (t.collaborators && t.collaborators.split(',').map(e => e.trim().toLowerCase()).includes(user.toLowerCase())) : !1; }
    function openTimeEntry(e) { if (!canAccessProject(e)) return void alert('Only the project creator, collaborators, or admins can log time on this project'); currentProjectId = e, currentEditingTimeEntryId = null, document.getElementById('timeEntryModalHeader').textContent = 'Log Time', document.getElementById('loggerName').value = '', document.getElementById('logDate').valueAsDate = new Date(), document.getElementById('logHours').value = '', document.getElementById('logNotes').value = '', document.getElementById('timeEntryDeleteBtn').style.display = 'none'; const t = timeEntries.filter(t => t.project_id == e); t.length ? (document.getElementById('timeLogDisplay').style.display = 'block', document.getElementById('timeLogList').innerHTML = t.map(e => `<div class="time-entry"><div class="time-entry-info">${e.date_worked}: ${e.hours}h - Logged by: ${e.logged_by || 'Unknown'} ${e.notes ? ' | ' + e.notes : ''}</div><div class="time-entry-actions"><button onclick="editTimeEntry('${e.id}')">Edit</button><button class="danger" onclick="removeTimeEntry('${e.id}')">Delete</button></div></div>`).join('')) : document.getElementById('timeLogDisplay').style.display = 'none', openModal('timeEntryModal'); }
    function editTimeEntry(e) { const t = timeEntries.find(t => t.id == e); t && (isAdmin || t.logged_by_email && t.logged_by_email.trim().toLowerCase() === user.trim().toLowerCase() || !t.logged_by_email ? (currentEditingTimeEntryId = e, document.getElementById('timeEntryModalHeader').textContent = 'Edit Time Entry', document.getElementById('loggerName').value = t.logged_by || '', document.getElementById('logDate').value = t.date_worked || '', document.getElementById('logHours').value = t.hours || '', document.getElementById('logNotes').value = t.notes || '', document.getElementById('timeEntryDeleteBtn').style.display = 'block') : alert('Only the person who logged this entry or admins can edit it')); }
    async function removeTimeEntry(e) { e = parseInt(e); const t = timeEntries.find(t => t.id == e); t && (isAdmin || t.logged_by_email && t.logged_by_email.trim().toLowerCase() === user.trim().toLowerCase() || !t.logged_by_email ? confirm('Delete this time entry?') && (testMode ? (timeEntries = timeEntries.filter(t => t.id != e), saveData()) : db && (await db.from('ssa_time_entries').delete().eq('id', e), await loadData()), (() => { const t = timeEntries.filter(t => t.project_id == currentProjectId); t.length ? (document.getElementById('timeLogDisplay').style.display = 'block', document.getElementById('timeLogList').innerHTML = t.map(e => `<div class="time-entry"><div class="time-entry-info">${e.date_worked}: ${e.hours}h - Logged by: ${e.logged_by || 'Unknown'} ${e.notes ? ' | ' + e.notes : ''}</div><div class="time-entry-actions"><button onclick="editTimeEntry('${e.id}')">Edit</button><button class="danger" onclick="removeTimeEntry('${e.id}')">Delete</button></div></div>`).join('')) : document.getElementById('timeLogDisplay').style.display = 'none'; })()) : alert('Only the person who logged this entry or admins can delete it')); }
    function deleteCurrentTimeEntry() { currentEditingTimeEntryId && removeTimeEntry(currentEditingTimeEntryId); }
